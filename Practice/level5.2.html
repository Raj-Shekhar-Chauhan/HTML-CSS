<!DOCTYPE html>
<html lang="en">
<head>
    <title>Label</title>
</head>
<body>
    <form action="/contact-me">
                  <label for="username">UserName: </label>  
                        <input type="text" placeholder="Email" name="UserName" id="username" required="true"> <br>
                    <label for="user_password"> Password:</label>
                        <input type="password" placeholder="Password" name="user_password" required="ture"> <br>
                    <label for="date">Date: </label>
                        <input type="date" name="date" id="date" required="true"> <br>
                    <label for="file">File: </label>
                        <input type="file" name="file" id="file" required="true"> <br>
                    <label for="colour">Colour:</label>
                        <input type="color" name="colour" id="colour"> <br>
                    <label for="range">Range: </label>
                        <input type="range" name="range" id="range"> <br>
                    <label for="button">Button: </label>
                        <input type="button" name="button" id="button" value="click me"> <br>
                        
                    <lable for="Male">Male: </lable>
                        <input type="radio" name="gender" id="Male" value="Male"> <br>    
                    <lable for="Female">Female: </lable>
                        <input type="radio" name="gender" id="Female" value="Female"> <br>    
                    <lable for="Other">Other: </lable>
                        <input type="radio" name="gender" id="Other" value="Other"> <br>

                    <lable for="Apple">Apple: </lable>
                        <input type="checkbox" name="Fruit" id="Apple" value="Apple"> <br>    
                    <lable for="Banana">Banana: </lable>
                        <input type="checkbox" name="Fruit" id="Banana" value="Banana"> <br>    
                    <lable for="Orange">Orange: </lable>
                        <input type="checkbox" name="Fruit" id="Orange" value="Orange"> <br>

                    <lable for="fruits">Choose a fruit: </lable>
                        <select id="fruits" name="fruits">
                            <option value="Apple">Apple</option>
                            <option value="Banana">Banana</option>
                            <option value="Orange">Orange</option>
                        </select> <br>
                        
                        <textarea name="Story" id="Story" rows="4" cols="10">
                            Please write a story.
                        </textarea>
                  <input type="submit">  
    </form>
</body>
</html>
